name: Release Gateway

# Chỉ build bộ cài (exe) khi COMMIT MỚI NHẤT của lần push lên main có chứa [release] trong message:
#   git commit -m "feat(gateway): nut tat hoan toan [release]"
# Không có [release] thì workflow bị bỏ qua (job "skipped"), không tốn phút build Windows.
#
# Phiên bản lấy từ Gateway/package.json, nên PHẢI tăng "version" trước khi release. Tag Git và GitHub
# Release có tên gateway-v<version> (giao diện Gateway dựa vào tiền tố này để báo có bản mới). Nếu
# release đó đã tồn tại thì workflow dừng ngay, không ghi đè bộ cài đã phát hành.
#
# Chạy tay (workflow_dispatch) chỉ build và đưa file vào Artifacts, không tạo Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Hai lần release không chạy chồng nhau; lần sau xếp hàng chờ chứ không hủy lần đang chạy dở.
concurrency:
  group: release-gateway
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test và typecheck Gateway
        run: |
          pnpm --filter @az-sentinel/gateway typecheck
          pnpm --filter @az-sentinel/gateway test

      - name: Xác định phiên bản
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content Gateway/package.json -Raw | ConvertFrom-Json).version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version khong hop le trong Gateway/package.json: '$v'" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Phien ban: $v"

      - name: Dừng sớm nếu phiên bản này đã được phát hành
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'gateway-v${{ steps.ver.outputs.version }}'
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0   # lệnh gh "không tìm thấy" trả mã 1; đừng để bước này thất bại vì nó
          if ($exists) {
            throw "Release $tag da ton tai. Tang version trong Gateway/package.json roi commit lai voi [release]."
          }

      - name: Build az-gateway.exe (esbuild + Node SEA)
        working-directory: Gateway
        run: |
          node packaging/bundle.mjs ${{ steps.ver.outputs.version }}
          node packaging/sea.mjs

      - name: Chạy thử exe (smoke test)
        shell: pwsh
        run: |
          $env:AZ_GW_DATA = Join-Path $env:RUNNER_TEMP 'azgw'
          $p = Start-Process -FilePath Gateway/dist/az-gateway.exe -PassThru -WindowStyle Hidden
          try {
            $s = $null
            for ($i = 0; $i -lt 20 -and -not $s; $i++) {
              Start-Sleep -Milliseconds 500
              try { $s = Invoke-RestMethod http://127.0.0.1:47800/v1/status } catch {}
            }
            if (-not $s) { throw 'Gateway khong tra loi /v1/status' }
            if ($s.version -ne '${{ steps.ver.outputs.version }}') { throw "Sai phien ban: $($s.version)" }
            Write-Host "OK: Gateway v$($s.version) dang chay"
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Build bộ cài (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" Installer\az-gateway.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC loi' }
          $f = 'Gateway\dist\AZSentinel-Gateway-Setup.exe'
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "$h  AZSentinel-Gateway-Setup.exe" | Out-File Gateway\dist\SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: AZSentinel-Gateway-${{ steps.ver.outputs.version }}
          path: |
            Gateway/dist/AZSentinel-Gateway-Setup.exe
            Gateway/dist/SHA256SUMS.txt

      - name: Tạo GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gateway-v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AZ Gateway v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            Gateway/dist/AZSentinel-Gateway-Setup.exe
            Gateway/dist/SHA256SUMS.txt
