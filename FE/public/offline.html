<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f172a" />
    <title>AZ Sentinel · Mất kết nối</title>
    <style>
      :root {
        --bg: #f8fafc;
        --ink: #0f172a;
        --muted: #475569;
        --accent: #0f172a;
        --accent-ink: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --ink: #f8fafc;
          --muted: #94a3b8;
          --accent: #f8fafc;
          --accent-ink: #0f172a;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.5; }
      button {
        min-height: 2.5rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.375rem;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Không có kết nối mạng</h1>
      <p>AZ Sentinel cần mạng để lấy dữ liệu tài khoản. Kiểm tra Wi-Fi hoặc 4G rồi thử lại.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
